<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color:rgb(212, 201, 201);
    }
    .card{
        width: 200px;
        height: 350px;
        background-color:rgb(255, 255, 255);
        border-radius: 10px;
        top:190px;
        left:650px;
        position: relative; 
    }
    .heart{
        position:absolute;
    }
    img{
        border-radius:10px 10px 0 0;
    }
    h2{
        color:green;
    }
    .price,.Content{
        margin-left: 20px;
    }
    .cart{
        background-color:black;
        color:white;
        height:30px;
        width:160px;
        margin-left:20px;
        margin-right:20px;
        border-radius: 10px;
        text-align: center;
        cursor:pointer;
    }
    .sale{
        display:inline;
        position:absolute;
        top:5px;
        left:10px;
        border:2px solid black;
        width:50px;
        height:20px;
        color:white;
        background-color:black;
        border-radius:1px;
        text-align: center;
    }
    .heart{
        position:absolute;
        right:5px;
        top:5px;
        background-color:rgb(55, 53, 53,50%);
        border-radius:50%;;
    }
    
</style>
<body>
    <div class="card">
        <div class="img"><img src="https://th.bing.com/th/id/OIP.wWW2-JT-5wWxQFmO6FMinAHaEv?w=248&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" width="200"></div>
        <div class="sale">SALE</div>
        <div class="heart">❤️</div>

        <div class="Content"><h1>Running Shoes</h1></div>
        <div class="price"><h2>₹2,999</h2></div>
        <div class="cart">Add To Cart</div>
    </div>
</body>

</html>
