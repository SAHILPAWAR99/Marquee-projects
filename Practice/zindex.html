<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index</title>
    <style>
        .z-index{
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: white;
        }
        .box1{
            position: absolute;
            top: 50px;
            left: 50px;
            width: 200px;
            height: 200px;
            background-color: red;
            z-index: 1;
        }
        .box2{
            position: absolute;
            top: 100px;
            left: 100px;
            width: 200px;
            height: 200px;
            background-color: green;
            z-index: 2;
        }
        .box3{
            position: absolute;
            top: 150px;
            left: 150px;
            width: 200px;
            height: 200px;
            background-color: blue;
            z-index: 3;
        }
        .box4{
            position: absolute;
            top: 200px;
            left: 200px;
            width: 200px;
            height: 200px;
            background-color: yellow;
            z-index: 4;
        }
        .box5{
            position: absolute;
            top: 250px;
            left: 250px;
            width: 200px;
            height: 200px;
            background-color: pink;
            z-index: 5; 
        }
    </style>
</head>
<body>
    <div class="z-index">
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
    </div>
</body>
</html>
