<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --bg1:purple;
            --bg2:rgb(150, 150, 57);
            --bg3:green;
        }
        h1{
            color:gray;
        }
        ol{
            color:#fff;
            position:relative;
            left:20px;
            bottom:10px;
        }
        body{
            background-color:#eee;
            display:flex;
            justify-content:center;
            align-items:center;

        }
        .divm{
            height:520px;
            width:400px;
            background-color:#eee;
            border:1px solid black;
            border-radius:10px;
        }
        .div1{
            width: rem;
            height: 100px;
            background-color:var(--bg1);
            margin: 20px;
            border-radius:10px;
        }
        .div2{
            width: rem;
            height: 100px;
            background-color:var(--bg2);
            margin: 20px;
            border-radius:10px;
        }
        .div3{
            width: rem;
            height: 100px;
            background-color: var(--bg3);
            margin: 20px;
            border-radius:10px;
        }
        h2{
            color:white;
            position:relative;
            left:20px;
            top:5px;
        }

        .drinkimg{
            height:80px;
            position:relative;
            left:250px;
            top:-110px;
        }
        .foodimg{
            height:80px;
            position:relative;
            left:250px;
            top:-110px;
        }
        .snackimg{
            height:80px;
            position:relative;
            left:250px;
            top:-110px;
        }
        img{
            border-radius:10px;
        }
        .about{
            background-color:black ;
            color:white;
            margin:10px;
            margin-top:2px;
            border-radius:10px;
            padding:2px;
        }
    </style>
</head>
<body>
    <div class="divm">
        <h1 align="center">One-8 Commune</h1>
        <div class="div1">
            <h2>Drinks</h2>
           <ol>
               <li>Tea</li>
               <li>Coffee</li>
               <li>Juice</li>
               </ol>
               <img src="https://th.bing.com/th/id/OIP.OUXGwI3uD6ZUwGGTEcB8zgHaHa?w=208&h=208&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" class="drinkimg">
        </div>
        <div class="div2">
            <h2>Food</h2>
            <ol>
                <li>Chole Bhature</li>
                <li>Roti</li>
                <li>Butter Chicken</li>
                </ol>
                <img src="https://th.bing.com/th/id/OIP.kBt87mR_bp5CfVcrwG1LowHaHa?w=195&h=195&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" class="foodimg">
        </div>
        <div class="div3">
            <h2>Snacks</h2>
            <ol>
                <li>chips</li>
                <li>Biscuits</li>
                <li>Cake</li>
                </ol>
                <img src="https://th.bing.com/th/id/OIP.2jjc_7pG0ypIwFuTL2xfQgHaHa?w=208&h=208&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" class="snackimg">
        </div>
        <div class="about">
            About Us:<br>
            One-8 Commune is a cafe that offers a variety of drinks, food, and snacks.
        </div>
    </div>
</body>
</html>
