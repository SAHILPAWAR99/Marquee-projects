<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4WNhVxUPDpt2Ehx2EmwdJLePiHKi4TzpShw&s" type="image/x-icon">
</head>
<body>
    <header>
        <div class="top"><div class="rightnav">
            <p style="font-size: large;">book<span>My</span>show</p>
            <div class="search">
            <img src="search-interface-symbol.png" height="20px" width="20px">
            <div class="searchbox"><input type="text" placeholder="Search for Movies, Events, Plays, Sports and Activities"></div>
            </div>
            </div>
            <div class="leftnav">
                <p>Vadodara</p>
                <button class="signin">Sign in</button>

                    <div class="line1"></div>
                    <div class="line2"></div>
                    <div class="line3"></div>
                </div>
            </div>
        </div>
        <div class="bottom">
            <div class="leftsub">
                <ul>
                    <li>Movies</li>
                    <li>Stream</li>
                    <li>Events</li>
                    <li>Plays</li>
                    <li>Sports</li>
                    <li>Activities</li>
                </ul>
            </div>
            <div class="rightsub">
                <ul>
                    <li>ListYourShow</li>
                    <li>Corporates</li>
                    <li>Offers</li>
                    <li>Gift Cards</li>
                </ul>
            </div>
        </div>
    </header>
    <main class="middle"></main>
    <hr>
